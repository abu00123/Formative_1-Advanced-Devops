name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Run Backend Linting
        run: npx oxlint backend/

      - name: Run Frontend Linting
        run: npm run lint --prefix frontend

      - name: Run Backend Tests
        run: npm test --prefix backend

      - name: Build Backend Docker Image
        run: docker build --target backend -t rwandan-archives-backend:test .

      - name: Build Frontend Docker Image
        run: docker build --target frontend -t rwandan-archives-frontend:test .

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Dependency Scan (npm audit)
        run: |
          npm audit --prefix backend --audit-level=high
          npm audit --prefix frontend --audit-level=high

      - name: IaC Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          soft_fail: false

      - name: Build Backend Image for Scanning
        run: docker build --target backend -t rwandan-archives-backend:scan .

      - name: Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rwandan-archives-backend:scan
          format: table
          exit-code: 1
          severity: CRITICAL
